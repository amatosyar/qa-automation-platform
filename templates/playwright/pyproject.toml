[project]
name = "qa-playwright-consumer"
version = "0.1.0"
description = "Playwright Python consumer for QA Automation Platform"
requires-python = ">=3.12,<3.13"

dependencies = [
    "playwright==1.64.1",
    "pytest==9.2.0",
    "pytest-playwright==0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
